[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "my-app"
version = "0.1.0"
description = "My App: a JupyterLab remix"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.5.0,!=6.30.0",
    "jupyter_server>=2.19.0,<3",
    "jupyterlab_server>=2.28.0,<3",
]

[project.scripts]
my-app = "my_app.app:main"

[tool.hatch.build.targets.wheel]
packages = ["my_app"]
exclude = ["my_app/static", "my_app/schemas", "my_app/themes"]

# The output of the frontend build: a missing folder stops the build.
[tool.hatch.build.targets.wheel.force-include]
"my_app/static" = "my_app/static"
"my_app/schemas" = "my_app/schemas"
"my_app/themes" = "my_app/themes"
