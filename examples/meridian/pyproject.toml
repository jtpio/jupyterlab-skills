[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "meridian-lab"
version = "0.1.0"
description = "JupyterLab arranged, themed and keyed like a desktop code editor"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = ["jupyter", "jupyterlab", "distribution", "theme"]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jupyterlab>=4.6.6,<4.7",
    "jupyterlab-code-formatter>=3.1,<4",
    "jupyterlab-execute-time>=3.3,<4",
    "jupyterlab-expand-selection>=0.4.1,<0.5",
    "jupyterlab-git>=0.55,<0.56",
    "jupyterlab-highlight-selected-word>=0.1.1,<0.2",
    "jupyterlab-indent-guides>=0.1,<0.2",
    "jupyterlab-lsp>=5.3,<6",
    "jupyterlab-quickopen>=2.3,<3",
    "jupyterlab-rainbow-brackets>=0.1,<0.2",
    "jupyterlab-search-replace>=1.1.3,<2",
    "jupyterlab-unfold>=0.3.4,<0.4",
    "lckr-jupyterlab-variableinspector>=3.2.4,<4",
    "python-lsp-ruff>=2.3,<3",
    "python-lsp-server>=1.15,<2",
    "ruff>=0.6",
]

[project.scripts]
meridian = "meridian_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["meridian_lab"]

# Folders that pip copies below sys.prefix. JupyterLab finds them there.
[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config" = "etc/jupyter"
"labextensions" = "share/jupyter/labextensions"

[tool.hatch.build.targets.sdist]
include = ["meridian_lab", "jupyter-config", "labextensions", "README.md"]
