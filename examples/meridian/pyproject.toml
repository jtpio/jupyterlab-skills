[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "meridian-lab"
version = "0.2.0"
description = "JupyterLab with the look and keys of a desktop code editor"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jupyterlab>=4.6,<5",
    "jupyterlab-lsp>=5.3",
    "python-lsp-server>=1.15",
    "python-lsp-ruff>=2.3",
    "jupyterlab-quickopen>=2.3",
    "jupyterlab-git>=0.55",
    "jupyterlab-search-replace>=1.1.3",
    "jupyterlab-unfold>=0.3.4",
    "jupyterlab-code-formatter>=3.1",
    "ruff>=0.8",
    "jupyterlab-indent-guides>=0.1",
]

[project.scripts]
meridian = "meridian_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["meridian_lab"]

# Folders that pip copies below sys.prefix. JupyterLab finds them there.
[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config" = "etc/jupyter"
"labextensions" = "share/jupyter/labextensions"

[tool.hatch.build.targets.sdist]
include = ["meridian_lab", "jupyter-config", "labextensions", "README.md"]
