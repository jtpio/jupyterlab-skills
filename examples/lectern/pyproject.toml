[build-system]
requires = ["hatchling>=1.21", "hatch-jupyter-builder>=0.9"]
build-backend = "hatchling.build"

[project]
name = "lectern"
version = "0.1.0"
description = "A two-pane lesson reader made of JupyterLab components"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ipykernel",
    "jupyter_server>=2.4,<3",
    "jupyterlab_server>=2.27,<3",
]

[project.scripts]
lectern = "lectern.app:main"

# The frontend build output is not in version control but belongs to the package.
[tool.hatch.build]
artifacts = ["lectern/static", "lectern/schemas", "lectern/themes"]

[tool.hatch.build.targets.wheel]
packages = ["lectern"]

[tool.hatch.build.targets.sdist]
exclude = ["node_modules", "build"]

# Build the frontend when it is missing, and refuse to make a package without it.
[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "lectern/static/bundle.js",
    "lectern/schemas/@jupyterlab/apputils-extension/themes.json",
    "lectern/themes/@jupyterlab/theme-light-extension/index.css",
]
skip-if-exists = ["lectern/static/bundle.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
editable_build_cmd = "build"
